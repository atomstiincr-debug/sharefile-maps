name: Check official links

on:
  schedule:
    - cron: "17 13 * * 1"   # Mondays 07:17 Costa Rica
  workflow_dispatch:
  push:
    paths: ["src/data.js"]

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate data
        run: node scripts/validate.js
      - name: Check links
        id: check
        shell: bash
        run: set -o pipefail; python3 scripts/check_links.py | tee links.txt
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('links.txt') ? fs.readFileSync('links.txt','utf8').split('\n').filter(l => l.startsWith('BAD')).join('\n') : 'See workflow log.';
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo,
              title: 'Broken official links ' + new Date().toISOString().slice(0,10),
              body: 'The weekly link check found broken links:\n\n```\n' + body + '\n```' });
