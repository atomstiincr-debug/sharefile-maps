<style>
/* Brand: Progress ShareFile green #5CE500 + charcoal #4B4E52, sampled from the official logo.
   Layout: licensing blueprint — a dense index on top, maps as banded grids (feature group × plan tier), tools as quiet panels. */
:root {
  --bg: #F2F4F7;
  --surface: #FFFFFF;
  --sunk: #E8ECF1;
  --ink: #142030;
  --muted: #586678;
  --line: #D3DAE3;
  --brand: #5CE500;
  --brand-ink: #15210B;
  --charcoal: #4B4E52;
  --accent: #2B7A0B;
  --accent-soft: #E9F9DD;
  --good: #1E7A4C;
  --warn: #9A5B00;
  --warn-soft: #FFF3DD;
  --tile-ink: #FFFFFF;
  --g-core: #3B5876;
  --g-sec: #9A2C3B;
  --g-ai: #5D3F98;
  --g-flow: #1E6A5B;
  --g-sign: #A84D18;
  --g-client: #1C5EA2;
  --g-integ: #685822;
  --vdr: #B8860B;
  --shadow: 0 1px 2px rgba(20, 32, 48, .06), 0 4px 16px rgba(20, 32, 48, .06);
  --f-display: "Montserrat", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D131A; --surface: #151E28; --sunk: #1B2632; --ink: #E4EBF3; --muted: #94A4B6; --line: #283646;
    --accent: #7FEA45; --accent-soft: #1C2E12; --good: #5BC98E; --warn: #F0B45A; --warn-soft: #3A2A10;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D131A; --surface: #151E28; --sunk: #1B2632; --ink: #E4EBF3; --muted: #94A4B6; --line: #283646;
  --accent: #7FEA45; --accent-soft: #1C2E12; --good: #5BC98E; --warn: #F0B45A; --warn-soft: #3A2A10;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); }
a { color: var(--accent); text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.7rem, 3.2vw, 2.4rem); font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 1.3rem; font-weight: 650; }
h3 { font-size: 1.02rem; font-weight: 650; }
p { margin: 0; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.lead { color: var(--muted); max-width: 68ch; }
.eyebrow { font: 600 .72rem/1 var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ── Shell */
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: inset 0 3px 0 var(--brand); }
.top-row { display: flex; align-items: center; gap: 14px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand svg { flex: none; }
.brand b { font: 700 1.12rem/1 var(--f-display); letter-spacing: -.01em; }
.brand small { display: block; font-size: .72rem; color: var(--muted); margin-top: 2px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: .7rem; font-weight: 600; padding: 3px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.top-tools { margin-left: auto; display: flex; gap: 8px; align-items: center; }
select, input[type="number"], input[type="search"], input[type="text"] {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 9px; min-height: 36px; max-width: 100%;
}
button { font: inherit; cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: var(--r); padding: 6px 12px; min-height: 36px; font-weight: 550; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { border-color: var(--charcoal); }
nav.main { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 6px; }
nav.main a { white-space: nowrap; text-decoration: none; color: var(--muted); font-weight: 550; font-size: .88rem; padding: 6px 10px; border-radius: var(--r); }
nav.main a:hover { color: var(--ink); background: var(--sunk); }
nav.main a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
main { padding-block: 28px 56px; min-height: 60vh; }
.page-head { display: grid; gap: 8px; margin-bottom: 22px; }
.page-head .meta { font-size: .82rem; color: var(--muted); }

/* ── Home index (m365maps-style) */
.index { border-top: 1px solid var(--line); margin-top: 20px; }
.index-row { display: grid; grid-template-columns: minmax(150px, 220px) 1fr; gap: 8px 16px; padding-block: 10px; border-bottom: 1px solid var(--line); align-items: baseline; }
.index-row > b { font-weight: 650; }
.index-links { display: flex; flex-wrap: wrap; gap: 6px 22px; min-width: 0; }
.index-links a { text-decoration: none; font-weight: 500; }
.index-links a:hover { text-decoration: underline; }
@media (max-width: 640px) { .index-row { grid-template-columns: 1fr; } }
.price-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 28px; }
.price { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 6px; }
.price .amt { font: 600 1.6rem/1 var(--f-mono); }
.price .amt small { font: 500 .78rem var(--f-body); color: var(--muted); }
.price .tier-bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.price .tier-bar i { display: block; height: 100%; background: var(--brand); }

/* ── Map */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 14px; }
.toolbar label { display: flex; align-items: center; gap: 8px; font-size: .86rem; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; flex-wrap: wrap; }
.seg a, .seg button { text-decoration: none; border: 0; background: var(--surface); color: var(--muted); padding: 6px 11px; font-size: .84rem; font-weight: 550; border-right: 1px solid var(--line); }
.seg > :last-child { border-right: 0; }
.seg [aria-current="true"], .seg [aria-pressed="true"] { background: var(--charcoal); color: #FFFFFF; box-shadow: inset 0 -3px 0 var(--brand); }
.map-frame { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); overflow-x: auto; }
.map-title { text-align: center; padding: 18px 12px 6px; }
.map-title h2 { color: var(--ink); font-size: 1.5rem; }
.map-title p { color: var(--muted); font-size: .82rem; }
.map { display: grid; gap: 10px; padding: 14px; min-width: 0; }
.map-head, .band { display: grid; grid-template-columns: 140px repeat(var(--cols), minmax(0, 1fr)); gap: 10px; }
.map-head .th { border-radius: var(--r); padding: 8px 10px; text-align: center; font: 700 .86rem/1.2 var(--f-display); color: #FFFFFF; background: var(--charcoal); box-shadow: inset 0 -3px 0 var(--brand); }
.map-head .th small { display: block; font: 500 .7rem var(--f-body); opacity: .8; margin-top: 2px; }
.map-head .th.t-P { background: #3A3D41; } .map-head .th.t-E { background: #2A2C2F; }
.band-label { display: flex; align-items: center; font: 700 .8rem/1.2 var(--f-display); color: var(--surface); border-radius: var(--r); padding: 8px 10px; }
.cell { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; min-height: 56px; min-width: 0; background: var(--sunk); }
.cell .cell-tier { display: none; }
.cell:empty::after { content: "—"; color: var(--muted); font-size: .8rem; margin: auto; }
.tile { position: relative; width: 112px; min-height: 58px; border-radius: 5px; color: var(--tile-ink); display: flex; transition: transform .12s, opacity .15s, filter .15s; }
.tile a { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 8px 14px 8px 6px; color: var(--tile-ink); text-decoration: none; font: 600 .7rem/1.18 var(--f-body); border-radius: 5px; }
.tile a:hover { text-decoration: underline; }
.tile:hover { transform: translateY(-1px); }
.tile .i { position: absolute; top: 3px; right: 3px; width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(255,255,255,.55); background: transparent; color: var(--tile-ink); font: 700 .62rem/1 var(--f-mono); padding: 0; display: grid; place-items: center; }
.tile .i:hover { background: rgba(255,255,255,.2); }
.tile .flags { position: absolute; left: 4px; bottom: 3px; display: flex; gap: 3px; }
.tile .flags span { font: 700 .52rem/1 var(--f-body); letter-spacing: .03em; padding: 2px 3px; border-radius: 3px; background: rgba(255,255,255,.92); color: #142030; }
.tile.vdr-only { box-shadow: 0 0 0 2px var(--vdr); }
.tile.dim { opacity: .22; filter: grayscale(.7); }
.tile.hit { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
.g-core { background: var(--g-core); } .g-sec { background: var(--g-sec); } .g-ai { background: var(--g-ai); }
.g-flow { background: var(--g-flow); } .g-sign { background: var(--g-sign); } .g-client { background: var(--g-client); } .g-integ { background: var(--g-integ); }
.map-foot { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 10px 14px 14px; font-size: .78rem; color: var(--muted); border-top: 1px solid var(--line); }
.map-foot .k { display: inline-flex; align-items: center; gap: 6px; }
.map-foot .k i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
@media (max-width: 760px) {
  .map-head { display: none; }
  .band { grid-template-columns: 1fr; }
  .cell .cell-tier { display: block; width: 100%; font: 600 .7rem/1 var(--f-body); color: var(--muted); letter-spacing: .05em; text-transform: uppercase; margin-bottom: 2px; }
  .tile { width: calc(50% - 3px); }
}
.vdr-out { margin-top: 18px; }
.vdr-out .cell { background: var(--surface); }

/* ── Detail panel */
.scrim { position: fixed; inset: 0; background: rgba(10, 16, 24, .45); z-index: 40; display: flex; justify-content: flex-end; }
.panel { width: min(440px, 100%); height: 100%; background: var(--surface); padding: 22px 20px calc(22px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; display: grid; align-content: start; gap: 14px; border-left: 1px solid var(--line); }
.panel .swatch { height: 6px; border-radius: 3px; }
.panel dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: .88rem; }
.panel dt { color: var(--muted); }
.panel dd { margin: 0; min-width: 0; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font-size: .74rem; font-weight: 600; padding: 3px 8px; border-radius: 99px; background: var(--sunk); color: var(--ink); border: 1px solid var(--line); }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.ok { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.note { background: var(--warn-soft); color: var(--ink); border-radius: var(--r); padding: 10px 12px; font-size: .86rem; }

/* ── Panels / forms */
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; min-width: 0; }
legend { font: 650 .95rem var(--f-display); margin-bottom: 6px; padding: 0; }
.choices { display: flex; flex-wrap: wrap; gap: 6px; }
.choice { position: relative; }
.choice input { position: absolute; opacity: 0; pointer-events: none; }
.choice span { display: block; padding: 7px 11px; border: 1px solid var(--line); border-radius: var(--r); font-size: .86rem; font-weight: 550; cursor: pointer; background: var(--surface); }
.choice input:checked + span { background: var(--charcoal); border-color: var(--charcoal); color: #FFFFFF; box-shadow: inset 0 -3px 0 var(--brand); }
.choice input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ShareFile Maps — app. Plain JS, no dependencies. */
(function () {
  "use strict";

  // ── Storage (tolerant)
  const store = {
    get(k, d) { try { const v = localStorage.getItem("sfm." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("sfm." + k, JSON.stringify(v)); } catch (e) { /* ignore */ } }
  };

  // ── Indexes
  const F = Object.fromEntries(FEATURES.map(f => [f.id, f]));
  const P = Object.fromEntries(PLANS.map(p => [p.id, p]));
  const G = Object.fromEntries(GROUPS.map(g => [g.id, g]));
  const IND = Object.fromEntries(INDUSTRIES.map(i => [i.id, i]));
  const TIERS = ["A", "P", "E"];

  // ── Language
  const pickLang = () => {
    const saved = store.get("lang", null);
    if (saved && UI[saved]) return saved;
    const n = (navigator.language || "es").slice(0, 2);
    return UI[n] ? n : "es";
  };
  let lang = pickLang();
  const t = () => UI[lang];
  const L = obj => (obj && (obj[lang] || obj.es || obj.en)) || "";
  const fmt = (s, map) => s.replace(/\{(\w+)\}/g, (_, k) => map[k] ?? "");
  const money = (n, dec = 2) => new Intl.NumberFormat(lang === "en" ? "en-US" : lang === "pt" ? "pt-BR" : "es-CR",
    { style: "currency", currency: "USD", minimumFractionDigits: dec, maximumFractionDigits: dec }).format(n);
  const int = n => new Intl.NumberFormat(lang === "en" ? "en-US" : lang === "pt" ? "pt-BR" : "es-CR").format(n);

  // ── Helpers
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const $ = (sel, root = document) => root.querySelector(sel);
  const tierOf = f => TIERS.find(x => f.plans.includes(x)) || null;
  const minPlan = ids => {
    let idx = 0;
    ids.forEach(id => { const tr = tierOf(F[id]); if (tr) idx = Math.max(idx, TIERS.indexOf(tr)); });
    return TIERS[idx];
  };
  const ext = (url, label, cls = "") => `<a href="${esc(url)}" target="_blank" rel="noopener" class="${cls}">${label}</a>`;
  const YT = id => "https://www.youtube.com/watch?v=" + id;
  const videosFor = (kind, id) => VIDEOS.filter(v => (v[kind] || []).includes(id));
  const videoList = vs => vs.map(v => `<li><span>▶ ${ext(YT(v.id), esc(v.t))}</span><span>${v.dur ? esc(v.dur) + " · " : ""}YouTube</span></li>`).join("");
  const flagsFor = f => (f.badges || []).filter(b => ["new", "us", "eu", "usreg"].includes(b))

  const tileHTML = (f, opts = {}) => {

    if (opts.rel === true) cls.push("hit");
    return `<div class="${cls.join(" ")}">
      <a href="${esc(f.url)}" target="_blank" rel="noopener" title="${esc(L(f.d))}">${esc(f.name)}</a>

  };
  const navKeys = ["home", "map", "vdr", "recommend", "usecases", "adopt", "compare", "matrix", "calc", "integrations", "compliance", "knowledge", "glossary"];

  function route() {
    let h = (location.hash || "#home").slice(1) || "home";

    const fn = routes[h] || renderHome;
    const navKey = h.startsWith("map") ? "map" : (routes[h] ? h : "home");
    renderChrome(navKey);

      <p>${u.by} ${esc(SITE.author)} · ${u.updated} <span class="num">${SITE.updated}</span> · v<span class="num">${SITE.version}</span> ·
        <a href="#changelog">${u.nav.changelog}</a> · <a href="#discrepancies">${u.nav.discrepancies}</a></p>`;
  }

  const head = (title, lead, extra = "") => `<div class="page-head"><h1>${esc(title)}</h1>${lead ? `<p class="lead">${esc(lead)}</p>` : ""}${extra}</div>`;
  const updatedLine = () => `<p class="meta">${t().updated} <span class="num">${SITE.updated}</span> · ${ext(SITE.pricingSource, "sharefile.com/plans")}</p>`;

        ${row(h.industries, INDUSTRIES.map(i => a("#recommend-" + i.id, L(i.name))).join(""))}

  // ── Recommender
  function recompute() {
    const r = state.rec;
    const ind = IND[r.ind];
    const needs = ind ? ind.f : [];
    let plan = ind ? minPlan(needs) : "A";
    const sigs = SIGNALS.filter(s => r.sig.includes(s.id));
    const entSigs = sigs.filter(s => !s.vdr);
    if (entSigs.length) plan = "E";
    const sub = ind && ind.subs ? ind.subs.find(s => s.id === r.sub) : null;
    const vdr = sigs.some(s => s.vdr) || (sub && sub.vdr);
    return { ind, needs, plan, entSigs, vdr, sub };
  }

  function renderCmpOut() {
    const u = t(), C = u.cmp, c = state.cmp, A = P[c.a], B = P[c.b];
    if (c.a === c.b) { $("#cmpout").innerHTML = `<p class="note">${esc(C.same)}</p>`; return; }
    const rel = relSet(c.hl);
    const onlyA = FEATURES.filter(f => f.plans.includes(c.a) && !f.plans.includes(c.b));
    const onlyB = FEATURES.filter(f => f.plans.includes(c.b) && !f.plans.includes(c.a));
    const both = FEATURES.filter(f => f.plans.includes(c.a) && f.plans.includes(c.b));
    const price = priceOf;
    const seats = p => Math.max(c.users, p.min);
    const tot = p => price(p) * seats(p);
    const dU = price(B) - price(A), dM = tot(B) - tot(A);
    const sign = n => (n > 0 ? "+" : n < 0 ? "−" : "") + money(Math.abs(n));
    // Feature in one plan whose upgraded version is in the other (e.g. Basic -> Enhanced Client Portal)
    const upIn = (f, other) => f.up && F[f.up] && F[f.up].plans.includes(other.id) ? F[f.up] : null;
    const item = (f, other) => { const up = other && upIn(f, other);
      return `<li class="${rel && rel.has(f.id) ? "rel" : ""}"><span>${ext(f.url, esc(f.name))}</span>${up ? `<span class="up">↑ ${esc(fmt(C.upTo, { p: other.name, y: up.name }))}</span>` : ""}</li>`; };
    const grouped = (arr, other) => arr.length ? GROUPS.map(g => { const xs = arr.filter(f => f.g === g.id);
      return xs.length ? `<div class="fgrp"><h4><i class="dot g-${g.id}"></i>${esc(L(g.name))} <span class="muted num">${xs.length}</span></h4><ul class="flist">${xs.map(f => item(f, other)).join("")}</ul></div>` : ""; }).join("")
      : `<p class="muted">${esc(C.none)}</p>`;
    const chips = arr => `<div class="gchips">${GROUPS.map(g => { const n = arr.filter(f => f.g === g.id).length;
      return n ? `<span class="gchip"><i class="dot g-${g.id}"></i>${esc(L(g.name))} <b class="num">${n}</b></span>` : ""; }).join("")}</div>`;
    const nA = FEATURES.filter(f => f.plans.includes(c.a)).length, nB = FEATURES.filter(f => f.plans.includes(c.b)).length;
    const lostA = onlyA.filter(f => !upIn(f, B)), upA = onlyA.filter(f => upIn(f, B));
    const lostB = onlyB.filter(f => !upIn(f, A));
    let summary;
    if (!lostA.length) summary = upA.length ? fmt(C.sumSuperUp, { a: A.name, b: B.name, k: onlyB.length, x: upA[0].name, y: upIn(upA[0], B).name }) : fmt(C.sumSuper, { a: A.name, b: B.name, k: onlyB.length });
    else if (!lostB.length) summary = fmt(C.sumSuper, { a: B.name, b: A.name, k: onlyA.length });
    else summary = fmt(C.sumGen, { a: A.name, b: B.name, na: nA, nb: nB, n: both.length });
    const neither = lostA.length && lostB.length;
    const featsOf = p => FEATURES.filter(f => f.plans.includes(p.id));
    // X = this column's plan, Y = the other; onlyX = features only in X; lostOther = Y-only features with no upgrade in X
    const col = (X, Y, onlyX, lostOther) => {
      const headX = `<h3>${esc(X.name)} <span class="muted num">· ${esc(fmt(C.count, { n: featsOf(X).length }))}</span></h3>`;
      if (!lostOther.length) { // X contains everything in Y (superset)
        const ups = FEATURES.filter(f => f.plans.includes(Y.id) && !f.plans.includes(X.id) && upIn(f, X));
        return `<div class="cmp-col" data-col="${X.id}">${headX}
          <details class="inherit"><summary>✓ ${esc(fmt(C.everything, { p: Y.name }))} <span class="muted num">(${both.length})</span></summary><div>${grouped(both)}</div></details>
          ${ups.map(f => `<p class="hint up">↑ ${esc(f.name)} → ${esc(upIn(f, X).name)}</p>`).join("")}
          <h4 class="plus">${esc(fmt(C.plus, { k: onlyX.length }))}</h4>${grouped(onlyX, Y)}</div>`;
      }
      if (!onlyX.filter(f => !upIn(f, Y)).length) // X is contained in Y: show X in full
        return `<div class="cmp-col" data-col="${X.id}">${headX}${grouped(featsOf(X), Y)}</div>`;
      return `<div class="cmp-col" data-col="${X.id}">${headX}<h4 class="plus">${esc(fmt(C.own, { p: X.name, k: onlyX.length }))}</h4>${grouped(onlyX, Y)}</div>`;
    };
    $("#cmpout").innerHTML = `
      <div class="kpis" style="margin-top:16px">
        <div class="kpi"><span>${esc(C.diff)} · ${esc(C.perUser)}</span><b class="delta ${dU > 0 ? "up" : "down"}">${sign(dU)}</b></div>
        <div class="kpi"><span>${esc(C.diff)} · ${esc(C.perMonth)}</span><b class="delta ${dM > 0 ? "up" : "down"}">${sign(dM)}</b></div>
        <div class="kpi"><span>${esc(C.diff)} · ${esc(C.perYear)}</span><b class="delta ${dM > 0 ? "up" : "down"}">${sign(dM * 12)}</b></div>
      </div>
      <p class="hint" style="margin-top:10px">${esc(fmt(C.seats, { u: int(c.users), list: [A, B].map(p => p.name + " " + int(seats(p)) + (seats(p) > c.users ? "*" : "")).join(" · ") }))}</p>
      ${[A, B].some(p => seats(p) > c.users) ? `<p class="note">${[A, B].filter(p => seats(p) > c.users).map(p => esc(fmt(C.seatsMin, { p: p.name, n: p.min }))).join("<br>")}</p>` : ""}
      <p class="cmp-sum" id="cmpsum">${esc(summary)}</p>
      ${neither ? `<section class="box cmp-base" id="cmpbase">
        <h3>${esc(fmt(C.base, { n: both.length, a: A.name, b: B.name }))}</h3>
        ${chips(both)}
        <details><summary>${esc(fmt(C.seeAll, { n: both.length }))}</summary><div class="fcols">${grouped(both)}</div></details>
      </section>` : ""}
      ${rel ? `<p class="hint" style="margin-top:10px">● ${esc(C.relevant)}: ${esc(L(IND[c.hl].name))}</p>` : ""}
      <div class="cmp-cols">${col(A, B, onlyA, lostB)}${col(B, A, onlyB, lostA)}</div>`;
  }

  function exportCsv() {
    const rows = mxRows();
    const q = v => '"' + String(v).replace(/"/g, '""') + '"';
    const lines = [["Group", "Feature", ...PLANS.map(p => p.name), "Description", "Notes", "Documentation"].map(q).join(",")];
    rows.forEach(f => lines.push([L(G[f.g].name), f.name, ...PLANS.map(p => f.plans.includes(p.id) ? "Yes" : ""), L(f.d), (f.badges || []).map(b => L(BADGES[b])).join("; "), f.url].map(q).join(",")));
    try {
      const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");

          <span class="pill ${n.check ? "warn" : "ok"}">${esc(n.check ? checkLabel(n) : C.ok)}</span></header>
        ${n.note ? `<p class="hint comp-nnote">${esc(L(n.note))}</p>` : ""}
        <p class="hint">${ext(n.url, esc(C.official))}</p>
        ${n.points.map(p => `<div class="comp-pt">
          <h4><span class="num">${esc(p.cite)}</span> · ${esc(L(p.topic))}</h4>
          <blockquote lang="${p.qlang || "es"}">${esc(p.quote)}<span class="hint"> — ${esc(C.extract)}</span></blockquote>
          <div class="comp-cols">
            <div><span class="eyebrow">${esc(C.sf)}</span><p>${esc(L(p.sf))}</p>
              ${p.f.length ? `<p class="ufeat">${p.f.map(id => `<button type="button" class="fchip" data-detail="${id}"><i class="dot g-${F[id].g}"></i>${esc(F[id].name)} <span class="muted">· ${esc(planOf(id))}${tierOf(F[id]) === "E" ? "" : "+"}</span></button>`).join("")}</p>` : ""}
              ${p.links.length ? `<p class="hint">${p.links.map(([h, l]) => ext(h, esc(l))).join(" · ")}</p>` : ""}</div>
            <div class="comp-you"><span class="eyebrow">${esc(C.you)}</span><p>${esc(L(p.you))}</p></div>
          </div></div>`).join("")}
      </article>`).join("")}
      <p class="hint" style="margin-top:16px">${esc(C.foot)} ${ext("https://trust.sharefile.com/", "trust.sharefile.com")}</p>`;
    document.querySelectorAll("[data-cc]").forEach(b => b.addEventListener("click", () => {
      state.cc = b.dataset.cc;
      try { history.replaceState(null, "", "#compliance-" + state.cc); } catch (e) { /* ignore */ }
      renderCompliance();
    }));
  }

  // ── Knowledge, glossary, logs
  function renderKnowledge() {
    const u = t();
    $("#view").innerHTML = `${head(u.kn.title, u.kn.lead)}
      <div class="cols">${KNOWLEDGE.map(k => `<section class="box"><h3>${esc(L(k.g))}</h3><ul class="links">${k.links.map(l => `<li>${l.v ? "▶ " : ""}${ext(l.u, esc(l.t))}${l.long ? ` <span class="hint">· ${esc(t().video.long)}</span>` : ""}</li>`).join("")}</ul></section>`).join("")}</div>`;
  }

  function renderGlossary() {
    const u = t();
    $("#view").innerHTML = `${head(u.gl.title, u.gl.lead)}
      <div class="toolbar"><input id="gq" type="search" placeholder="${esc(u.gl.search)}" aria-label="${esc(u.gl.search)}"></div>
      <dl class="gl box" id="gll"></dl>`;
    const draw = () => {
      const q = $("#gq").value.toLowerCase();
      $("#gll").innerHTML = GLOSSARY.filter(g => !q || g.term.toLowerCase().includes(q) || L(g.d).toLowerCase().includes(q))
        .map(g => `<div><dt>${esc(g.term)}</dt><dd>${esc(L(g.d))}</dd></div>`).join("");
    };
    $("#gq").addEventListener("input", draw); draw();
  }

  function renderChangelog() {
    const u = t();
    $("#view").innerHTML = `${head(u.ch.title, u.ch.lead)}
      <div class="tbl-wrap"><table><tbody>${CHANGELOG.map(c => `<tr><td class="num" style="width:110px">${c.date}</td><td class="num" style="width:70px">v${c.v}</td><td>${esc(L(c.d))}</td></tr>`).join("")}</tbody></table></div>`;
  }

  function renderDisc() {
    const u = t();
    $("#view").innerHTML = `${head(u.ds.title, u.ds.lead)}
      <div class="tbl-wrap"><table><thead><tr><th>#</th><th>${esc(u.ds.title)}</th><th>${esc(u.ds.where)}</th></tr></thead><tbody>
      ${DISCREPANCIES.map((d, i) => `<tr><td class="num">${i + 1}</td><td>${esc(L(d.d))}</td><td>${ext(d.where, esc(d.where.replace(/^https:\/\/(www\.)?/, "")))}</td></tr>`).join("")}
      </tbody></table></div>`;
  }

  // ── Toast
  function toast(msg) {
    const el = document.createElement("div"); el.className = "toast"; el.textContent = msg;
    document.body.appendChild(el); setTimeout(() => el.remove(), 2200);
  }

  // ── Analytics with consent (only when an ID is configured)
  function loadAnalytics() {
    if (!SITE.analyticsId) return;
    const s = document.createElement("script");
    s.async = true; s.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(SITE.analyticsId);
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { window.dataLayer.push(arguments); };
    window.gtag("js", new Date()); window.gtag("config", SITE.analyticsId, { anonymize_ip: true });
  }
  function cookieBanner() {
    if (!SITE.analyticsId) return;
    const c = store.get("consent", null);
    if (c === "yes") { loadAnalytics(); return; }
    if (c === "no") return;
    const u = t(), el = document.createElement("div");
    el.className = "cookie"; el.setAttribute("role", "region");
    el.innerHTML = `<p>${esc(u.cookies.text)}</p><button class="btn" type="button" data-c="no">${esc(u.cookies.reject)}</button><button class="btn primary" type="button" data-c="yes">${esc(u.cookies.accept)}</button>`;
    el.addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (!b) return; store.set("consent", b.dataset.c); if (b.dataset.c === "yes") loadAnalytics(); el.remove(); });
    document.body.appendChild(el);
  }

  // ── Theme
  function applyTheme() {
    const th = store.get("theme", "system");
    if (th === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", th);
  }

  // ── Boot
  document.addEventListener("click", e => {
    const bt = e.target.closest("[data-bill]");
    if (bt) { state.bill = bt.dataset.bill; store.set("bill", state.bill); const y = window.scrollY; route(); window.scrollTo(0, y); return; }
    const d = e.target.closest("[data-detail]");
    if (d) { e.preventDefault(); openDetail(d.dataset.detail); }
  });
  // Skip link: move focus to the content without changing the route
  $("#skip").addEventListener("click", e => { e.preventDefault(); $("#view").focus(); });
  $("#lang").addEventListener("change", e => { lang = e.target.value; store.set("lang", lang); document.documentElement.lang = lang; route(); });
  $("#theme").addEventListener("click", () => {
    const order = ["system", "light", "dark"], cur = store.get("theme", "system");
    store.set("theme", order[(order.indexOf(cur) + 1) % 3]); applyTheme(); renderChrome(($("#nav [aria-current]") || {}).getAttribute ? $("#nav [aria-current]").getAttribute("href").slice(1) : "home");
  });
  window.addEventListener("hashchange", route);
  document.documentElement.lang = lang;
  applyTheme();
  route();
  cookieBanner();
})();

</script>

</body>
</html>
