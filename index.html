<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShareFile Maps</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Unofficial map of ShareFile plans: features, industries, comparator, matrix and price calculator, linked to official documentation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Brand: Progress ShareFile green #5CE500 + charcoal #4B4E52, sampled from the official logo.
   Layout: licensing blueprint — a dense index on top, maps as banded grids (feature group × plan tier), tools as quiet panels. */
:root {
  --bg: #F2F4F7;
  --surface: #FFFFFF;
  --sunk: #E8ECF1;
  --ink: #142030;
  --muted: #586678;
  --line: #D3DAE3;
  --brand: #5CE500;
  --brand-ink: #15210B;
  --charcoal: #4B4E52;
  --accent: #2B7A0B;
  --accent-soft: #E9F9DD;
  --good: #1E7A4C;
  --warn: #9A5B00;
  --warn-soft: #FFF3DD;
  --tile-ink: #FFFFFF;
  --g-core: #3B5876;
  --g-sec: #9A2C3B;
  --g-ai: #5D3F98;
  --g-flow: #1E6A5B;
  --g-sign: #A84D18;
  --g-client: #1C5EA2;
  --g-integ: #685822;
  --vdr: #B8860B;
  --shadow: 0 1px 2px rgba(20, 32, 48, .06), 0 4px 16px rgba(20, 32, 48, .06);
  --f-display: "Montserrat", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D131A; --surface: #151E28; --sunk: #1B2632; --ink: #E4EBF3; --muted: #94A4B6; --line: #283646;
    --accent: #7FEA45; --accent-soft: #1C2E12; --good: #5BC98E; --warn: #F0B45A; --warn-soft: #3A2A10;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D131A; --surface: #151E28; --sunk: #1B2632; --ink: #E4EBF3; --muted: #94A4B6; --line: #283646;
  --accent: #7FEA45; --accent-soft: #1C2E12; --good: #5BC98E; --warn: #F0B45A; --warn-soft: #3A2A10;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); }
a { color: var(--accent); text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.7rem, 3.2vw, 2.4rem); font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 1.3rem; font-weight: 650; }
h3 { font-size: 1.02rem; font-weight: 650; }
p { margin: 0; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.lead { color: var(--muted); max-width: 68ch; }
.eyebrow { font: 600 .72rem/1 var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ── Shell */
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: inset 0 3px 0 var(--brand); }
.top-row { display: flex; align-items: center; gap: 14px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand svg { flex: none; }
.brand b { font: 700 1.12rem/1 var(--f-display); letter-spacing: -.01em; }
.brand small { display: block; font-size: .72rem; color: var(--muted); margin-top: 2px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: .7rem; font-weight: 600; padding: 3px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.top-tools { margin-left: auto; display: flex; gap: 8px; align-items: center; }
select, input[type="number"], input[type="search"], input[type="text"] {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 9px; min-height: 36px; max-width: 100%;
}
button { font: inherit; cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: var(--r); padding: 6px 12px; min-height: 36px; font-weight: 550; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { border-color: var(--charcoal); }
nav.main { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 6px; }
nav.main a { white-space: nowrap; text-decoration: none; color: var(--muted); font-weight: 550; font-size: .88rem; padding: 6px 10px; border-radius: var(--r); }
nav.main a:hover { color: var(--ink); background: var(--sunk); }
nav.main a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
main { padding-block: 28px 56px; min-height: 60vh; }
.page-head { display: grid; gap: 8px; margin-bottom: 22px; }
.page-head .meta { font-size: .82rem; color: var(--muted); }

/* ── Home index (m365maps-style) */
.index { border-top: 1px solid var(--line); margin-top: 20px; }
.index-row { display: grid; grid-template-columns: minmax(150px, 220px) 1fr; gap: 8px 16px; padding-block: 10px; border-bottom: 1px solid var(--line); align-items: baseline; }
.index-row > b { font-weight: 650; }
.index-links { display: flex; flex-wrap: wrap; gap: 6px 22px; min-width: 0; }
.index-links a { text-decoration: none; font-weight: 500; }
.index-links a:hover { text-decoration: underline; }
@media (max-width: 640px) { .index-row { grid-template-columns: 1fr; } }
.price-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 28px; }
.price { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 6px; }
.price .amt { font: 600 1.6rem/1 var(--f-mono); }
.price .amt small { font: 500 .78rem var(--f-body); color: var(--muted); }
.price .tier-bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.price .tier-bar i { display: block; height: 100%; background: var(--brand); }

/* ── Map */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 14px; }
.toolbar label { display: flex; align-items: center; gap: 8px; font-size: .86rem; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; flex-wrap: wrap; }
.seg a, .seg button { text-decoration: none; border: 0; background: var(--surface); color: var(--muted); padding: 6px 11px; font-size: .84rem; font-weight: 550; border-right: 1px solid var(--line); }
.seg > :last-child { border-right: 0; }
.seg [aria-current="true"], .seg [aria-pressed="true"] { background: var(--charcoal); color: #FFFFFF; box-shadow: inset 0 -3px 0 var(--brand); }
.map-frame { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); overflow-x: auto; }
.map-title { text-align: center; padding: 18px 12px 6px; }
.map-title h2 { color: var(--ink); font-size: 1.5rem; }
.map-title p { color: var(--muted); font-size: .82rem; }
.map { display: grid; gap: 10px; padding: 14px; min-width: 0; }
.map-head, .band { display: grid; grid-template-columns: 140px repeat(var(--cols), minmax(0, 1fr)); gap: 10px; }
.map-head .th { border-radius: var(--r); padding: 8px 10px; text-align: center; font: 700 .86rem/1.2 var(--f-display); color: #FFFFFF; background: var(--charcoal); box-shadow: inset 0 -3px 0 var(--brand); }
.map-head .th small { display: block; font: 500 .7rem var(--f-body); opacity: .8; margin-top: 2px; }
.map-head .th.t-P { background: #3A3D41; } .map-head .th.t-E { background: #2A2C2F; }
.band-label { display: flex; align-items: center; font: 700 .8rem/1.2 var(--f-display); color: var(--surface); border-radius: var(--r); padding: 8px 10px; }
.cell { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; min-height: 56px; min-width: 0; background: var(--sunk); }
.cell .cell-tier { display: none; }
.cell:empty::after { content: "—"; color: var(--muted); font-size: .8rem; margin: auto; }
.tile { position: relative; width: 112px; min-height: 58px; border-radius: 5px; color: var(--tile-ink); display: flex; transition: transform .12s, opacity .15s, filter .15s; }
.tile a { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 8px 14px 8px 6px; color: var(--tile-ink); text-decoration: none; font: 600 .7rem/1.18 var(--f-body); border-radius: 5px; }
.tile a:hover { text-decoration: underline; }
.tile:hover { transform: translateY(-1px); }
.tile .i { position: absolute; top: 3px; right: 3px; width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(255,255,255,.55); background: transparent; color: var(--tile-ink); font: 700 .62rem/1 var(--f-mono); padding: 0; display: grid; place-items: center; }
.tile .i:hover { background: rgba(255,255,255,.2); }
.tile .flags { position: absolute; left: 4px; bottom: 3px; display: flex; gap: 3px; }
.tile .flags span { font: 700 .52rem/1 var(--f-body); letter-spacing: .03em; padding: 2px 3px; border-radius: 3px; background: rgba(255,255,255,.92); color: #142030; }
.tile.vdr-only { box-shadow: 0 0 0 2px var(--vdr); }
.tile.dim { opacity: .22; filter: grayscale(.7); }
.tile.hit { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
.g-core { background: var(--g-core); } .g-sec { background: var(--g-sec); } .g-ai { background: var(--g-ai); }
.g-flow { background: var(--g-flow); } .g-sign { background: var(--g-sign); } .g-client { background: var(--g-client); } .g-integ { background: var(--g-integ); }
.map-foot { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 10px 14px 14px; font-size: .78rem; color: var(--muted); border-top: 1px solid var(--line); }
.map-foot .k { display: inline-flex; align-items: center; gap: 6px; }
.map-foot .k i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
@media (max-width: 760px) {
  .map-head { display: none; }
  .band { grid-template-columns: 1fr; }
  .cell .cell-tier { display: block; width: 100%; font: 600 .7rem/1 var(--f-body); color: var(--muted); letter-spacing: .05em; text-transform: uppercase; margin-bottom: 2px; }
  .tile { width: calc(50% - 3px); }
}
.vdr-out { margin-top: 18px; }
.vdr-out .cell { background: var(--surface); }

/* ── Detail panel */
.scrim { position: fixed; inset: 0; background: rgba(10, 16, 24, .45); z-index: 40; display: flex; justify-content: flex-end; }
.panel { width: min(440px, 100%); height: 100%; background: var(--surface); padding: 22px 20px calc(22px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; display: grid; align-content: start; gap: 14px; border-left: 1px solid var(--line); }
.panel .swatch { height: 6px; border-radius: 3px; }
.panel dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: .88rem; }
.panel dt { color: var(--muted); }
.panel dd { margin: 0; min-width: 0; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font-size: .74rem; font-weight: 600; padding: 3px 8px; border-radius: 99px; background: var(--sunk); color: var(--ink); border: 1px solid var(--line); }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.ok { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.note { background: var(--warn-soft); color: var(--ink); border-radius: var(--r); padding: 10px 12px; font-size: .86rem; }

/* ── Panels / forms */
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; min-width: 0; }
legend { font: 650 .95rem var(--f-display); margin-bottom: 6px; padding: 0; }
.choices { display: flex; flex-wrap: wrap; gap: 6px; }
.choice { position: relative; }
.choice input { position: absolute; opacity: 0; pointer-events: none; }
.choice span { display: block; padding: 7px 11px; border: 1px solid var(--line); border-radius: var(--r); font-size: .86rem; font-weight: 550; cursor: pointer; background: var(--surface); }
.choice input:checked + span { background: var(--charcoal); border-color: var(--charcoal); color: #FFFFFF; box-shadow: inset 0 -3px 0 var(--brand); }
.choice input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: .9rem; padding: 6px 0; cursor: pointer; }
.check input { margin-top: 4px; width: 16px; height: 16px; accent-color: var(--accent); flex: none; }
.hint { font-size: .78rem; color: var(--muted); }
.result-plan { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.result-plan strong { font: 700 2rem/1 var(--f-display); color: var(--accent); }
.flist { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; font-size: .88rem; }
.flist li { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; border-bottom: 1px dotted var(--line); padding-block: 4px; }
.flist li span:last-child { color: var(--muted); font-size: .8rem; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 2px; display: inline-block; flex: none; transform: translateY(1px); margin-right: 6px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* ── Compare */
.cmp-head { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.cmp-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
@media (max-width: 720px) { .cmp-cols { grid-template-columns: 1fr; } }
.delta { font: 600 1.5rem/1 var(--f-mono); }
.delta.up { color: var(--warn); } .delta.down { color: var(--good); }
.flist li.rel { font-weight: 650; }
.flist li.rel::after { content: "●"; color: var(--accent); font-size: .6rem; margin-left: 4px; }

/* ── Matrix */
.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: .86rem; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
thead th { position: sticky; top: 0; background: var(--surface); font: 650 .8rem var(--f-display); z-index: 1; }
td.c, th.c { text-align: center; width: 92px; }
tr.grp td { background: var(--sunk); font: 650 .78rem var(--f-display); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.yes { color: var(--good); font-weight: 700; }
.no { color: var(--line); }
td .feat a { font-weight: 550; text-decoration: none; }
td .feat a:hover { text-decoration: underline; }
td .sub { display: block; color: var(--muted); font-size: .78rem; }
.mx-count { font-size: .8rem; color: var(--muted); }

/* ── Calculator */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { background: var(--sunk); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 4px; }
.kpi b { font: 600 1.35rem/1.1 var(--f-mono); }
.kpi span { font-size: .78rem; color: var(--muted); }

/* ── Knowledge / glossary / logs */
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.links { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: .9rem; }
.gl { display: grid; gap: 0; }
.gl div { display: grid; grid-template-columns: minmax(140px, 220px) 1fr; gap: 6px 18px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.gl dt { font-weight: 650; font-family: var(--f-display); }
.gl dd { margin: 0; color: var(--ink); min-width: 0; }
@media (max-width: 600px) { .gl div { grid-template-columns: 1fr; } }

footer { border-top: 1px solid var(--line); background: var(--surface); }
footer .wrap { padding-block: 22px calc(22px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; font-size: .8rem; color: var(--muted); max-width: 1240px; }
.cookie { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 50; max-width: 640px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 8px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: .88rem; }
.cookie p { flex: 1 1 260px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: var(--r); font-size: .86rem; z-index: 60; }

/* Billing toggle */
.seg.bill button { min-height: 34px; }
.was { color: var(--muted); font-size: .62em; font-weight: 500; text-decoration-thickness: 1.5px; margin-right: 4px; }
.save { color: var(--accent); font-weight: 700; }
.price .amt { display: flex; align-items: baseline; gap: 2px; flex-wrap: wrap; }
.result-plan .seg { margin-left: auto; }

/* Integrations */
.m365 { border-left: 4px solid var(--brand); }
.m365 > p { max-width: 75ch; }
.igroup { margin-top: 26px; display: grid; gap: 12px; }
.igrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 12px; }
.icard { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.icard h3 a { text-decoration: none; }
.icard h3 a:hover { text-decoration: underline; }
.icard p { font-size: .9rem; }

</style>
</head>
<body>
<a href="#view" style="position:absolute;left:-9999px">Skip</a>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <a class="brand" href="#home" aria-label="ShareFile Maps">
        <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
          <rect x="1" y="1" width="13" height="13" rx="2.5" fill="#5CE500"/>
          <rect x="16" y="1" width="13" height="13" rx="2.5" fill="#4B4E52"/>
          <rect x="1" y="16" width="13" height="13" rx="2.5" fill="#4B4E52"/>
          <rect x="16" y="16" width="13" height="13" rx="2.5" fill="#5CE500"/>
        </svg>
        <span><b>ShareFile Maps</b><small id="brand-tag"></small></span>
      </a>
      <span class="chip" id="unofficial"></span>
      <div class="top-tools">
        <select id="lang"><option value="es">ES</option><option value="en">EN</option><option value="pt">PT</option></select>
        <button class="btn" type="button" id="theme"></button>
      </div>
    </div>
    <nav class="main" id="nav" aria-label="Main"></nav>
  </div>
</header>
<main class="wrap" id="view" tabindex="-1"></main>
<footer><div class="wrap" id="foot"></div></footer>
<script>
/* ShareFile Maps — single source of truth.
   Every product fact comes from sharefile.com or docs.sharefile.com.
   Verified: 2026-10-08. Edit here; everything else is generated from this file. */

const D = "https://docs.sharefile.com/en-us/sharefile/";
const W = "https://www.sharefile.com/";

const SITE = {
  version: "1.3.0",
  updated: "2026-10-08",
  author: "Adrián Bonilla",
  pricingSource: W + "plans",
  analyticsId: "" // GA4 measurement ID (G-XXXXXXX). Empty = no analytics, no cookie banner.
};

/* Plans: MSRP in USD per user per month, from sharefile.com/plans (2026-10-08). */
const PLANS = [
  { id: "A", key: "advanced",   name: "Advanced",          annual: 16.50, monthly: 18.15, min: 3, page: W + "plans",
    tag: { es: "Archivos seguros para equipos", en: "Secure file sharing for teams", pt: "Compartilhamento seguro para equipes" } },
  { id: "P", key: "premium",    name: "Premium",           annual: 26.00, monthly: 28.59, min: 3, page: W + "plans/sharefile-premium",
    tag: { es: "Flujos documentales con clientes", en: "End-to-end document workflows", pt: "Fluxos documentais com clientes" } },

(function () {
  "use strict";

  // ── Storage (tolerant)
  const store = {
    get(k, d) { try { const v = localStorage.getItem("sfm." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("sfm." + k, JSON.stringify(v)); } catch (e) { /* ignore */ } }
  };

  // ── Indexes
  const F = Object.fromEntries(FEATURES.map(f => [f.id, f]));
  const P = Object.fromEntries(PLANS.map(p => [p.id, p]));
  const G = Object.fromEntries(GROUPS.map(g => [g.id, g]));
  const IND = Object.fromEntries(INDUSTRIES.map(i => [i.id, i]));
  const TIERS = ["A", "P", "E"];

  // ── Language
  const pickLang = () => {
    const saved = store.get("lang", null);
    if (saved && UI[saved]) return saved;
    const n = (navigator.language || "es").slice(0, 2);
    return UI[n] ? n : "es";
  };
  let lang = pickLang();
  const t = () => UI[lang];
  const L = obj => (obj && (obj[lang] || obj.es || obj.en)) || "";
  const fmt = (s, map) => s.replace(/\{(\w+)\}/g, (_, k) => map[k] ?? "");
  const money = (n, dec = 2) => new Intl.NumberFormat(lang === "en" ? "en-US" : lang === "pt" ? "pt-BR" : "es-CR",
    { style: "currency", currency: "USD", minimumFractionDigits: dec, maximumFractionDigits: dec }).format(n);
  const int = n => new Intl.NumberFormat(lang === "en" ? "en-US" : lang === "pt" ? "pt-BR" : "es-CR").format(n);

  // ── Helpers
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const $ = (sel, root = document) => root.querySelector(sel);
  const tierOf = f => TIERS.find(x => f.plans.includes(x)) || null;
  const minPlan = ids => {
    let idx = 0;
    ids.forEach(id => { const tr = tierOf(F[id]); if (tr) idx = Math.max(idx, TIERS.indexOf(tr)); });
    return TIERS[idx];
  };
  const ext = (url, label, cls = "") => `<a href="${esc(url)}" target="_blank" rel="noopener" class="${cls}">${label}</a>`;
  const flagsFor = f => (f.badges || []).filter(b => ["new", "us", "eu", "usreg"].includes(b))
    .map(b => `<span>${b === "new" ? "NEW" : b === "eu" ? "EU" : "US"}</span>`).join("");

  const tileHTML = (f, opts = {}) => {
    const cls = ["tile", "g-" + f.g];
    if (f.plans === "V") cls.push("vdr-only");
    if (opts.rel === false) cls.push("dim");
    if (opts.rel === true) cls.push("hit");
    return `<div class="${cls.join(" ")}">
      <a href="${esc(f.url)}" target="_blank" rel="noopener" title="${esc(L(f.d))}">${esc(f.name)}</a>
      <button class="i" type="button" data-detail="${f.id}" aria-label="${esc(t().info + ": " + f.name)}">i</button>
      <div class="flags" aria-hidden="true">${flagsFor(f)}</div>
    </div>`;
  };

  // ── State
  const state = {
    hl: store.get("hl", ""),
    rec: store.get("rec", { ind: "accounting", sub: "", size: "mid", sig: [] }),
    cmp: store.get("cmp", { a: "P", b: "E", users: 25, bill: "annual", hl: "" }),
    calc: store.get("calc", { plan: "P", users: 25, bill: "annual" }),
    mx: { q: "", g: "", i: "", diff: false },
    bill: store.get("bill", "annual")
  };
  const priceOf = p => state.bill === "annual" ? p.annual : p.monthly;

  // ── Routes

  };

  function route() {

    const fn = routes[h] || renderHome;
    const navKey = h.startsWith("map") ? "map" : (routes[h] ? h : "home");
    renderChrome(navKey);
    $("#view").innerHTML = "";
    fn();
    document.title = (navKey === "home" ? "" : t().nav[navKey] + " · ") + "ShareFile Maps";
    window.scrollTo(0, 0);
  }

  // ── Plan map
  function industrySelect(id, val) {
    return `<select id="${id}"><option value="">${esc(t().map.none)}</option>${INDUSTRIES.map(i => `<option value="${i.id}" ${i.id === val ? "selected" : ""}>${esc(L(i.name))}</option>`).join("")}</select>`;
  }
  function relSet(indId) { return indId && IND[indId] ? new Set(IND[indId].f) : null; }

  function renderMap(view) {
    const u = t(), m = u.map;
    const cols = view === "all" ? TIERS : [view];
    const rel = relSet(state.hl);
    const names = { A: m.tierA, P: m.tierP, E: m.tierE };
    const hints = { A: m.tierAHint, P: m.tierPHint, E: m.tierEHint };
    const title = view === "all" ? m.title : names[view];
    const bands = GROUPS.map(g => {
      const cells = cols.map(tr => {
        const fs = FEATURES.filter(f => f.g === g.id && tierOf(f) === tr);
        return `<div class="cell"><span class="cell-tier">${esc(names[tr])}</span>${fs.map(f => tileHTML(f, { rel: rel ? rel.has(f.id) : undefined })).join("")}</div>`;

      const any = cols.some(tr => FEATURES.some(f => f.g === g.id && tierOf(f) === tr));
      if (!any) return "";
      return `<div class="band"><div class="band-label g-${g.id}">${esc(L(g.name))}</div>${cells.join("")}</div>`;

    </aside>`;
    const close = () => { wrap.remove(); document.removeEventListener("keydown", onKey); };

    wrap.addEventListener("click", e => { if (e.target === wrap || e.target.closest("[data-close]")) close(); });
    document.addEventListener("keydown", onKey);
    document.body.appendChild(wrap);

  // ── Recommender
  function recompute() {
    const r = state.rec;
    const ind = IND[r.ind];
    const needs = ind ? ind.f : [];
    let plan = ind ? minPlan(needs) : "A";
    const sigs = SIGNALS.filter(s => r.sig.includes(s.id));
    const entSigs = sigs.filter(s => !s.vdr);
    if (entSigs.length) plan = "E";
    const sub = ind && ind.subs ? ind.subs.find(s => s.id === r.sub) : null;
    const vdr = sigs.some(s => s.vdr) || (sub && sub.vdr);
    return { ind, needs, plan, entSigs, vdr, sub };
  }

  function renderRec() {
    const u = t(), R = u.rec, r = state.rec;
    const choice = (name, val, label, checked, extra = "") => `<label class="choice"><input type="radio" name="${name}" value="${val}" ${checked ? "checked" : ""}><span>${esc(label)}</span></label>${extra}`;
    $("#view").innerHTML = `

      <div class="grid2">
        <form class="box" id="recf" onsubmit="return false">
          <fieldset><legend>${esc(R.q1)}</legend><div class="choices">
            ${INDUSTRIES.map(i => choice("ind", i.id, L(i.name), r.ind === i.id)).join("")}

          </div>${r.ind === "other" ? `<p class="hint">${esc(R.otherHint)}</p>` : ""}</fieldset>
          ${IND[r.ind] && IND[r.ind].subs ? `<fieldset><legend>${esc(R.q1b)}</legend><div class="choices">
            ${IND[r.ind].subs.map(s => choice("sub", s.id, L(s.name), r.sub === s.id)).join("")}</div></fieldset>` : ""}
          <fieldset><legend>${esc(R.q2)}</legend><div class="choices">
            ${SIZES.map(s => choice("size", s.id, L(s.name), r.size === s.id)).join("")}
          </div><p class="hint">${esc(L((SIZES.find(s => s.id === r.size) || SIZES[1]).hint))}</p></fieldset>
          <fieldset><legend>${esc(R.q3)}</legend><p class="hint">${esc(R.q3hint)}</p>
            ${SIGNALS.map(s => `<label class="check"><input type="checkbox" name="sig" value="${s.id}" ${r.sig.includes(s.id) ? "checked" : ""}><span>${esc(L(s.t))}</span></label>`).join("")}
          </fieldset>
        </form>
        <section class="box" id="recout" aria-live="polite"></section>
      </div>`;
    $("#recf").addEventListener("change", e => {
      const el = e.target;
      if (el.name === "ind") { r.ind = el.value; r.sub = ""; store.set("rec", r); renderRec(); return; }
      if (el.name === "sub") r.sub = el.value;

      if (el.name === "sig") r.sig = [...document.querySelectorAll('input[name="sig"]:checked')].map(x => x.value);
      store.set("rec", r); renderRecOut();
    });
    renderRecOut();
  }

  function renderRecOut() {
    const u = t(), R = u.rec, res = recompute();
    const p = P[res.plan];
    const size = SIZES.find(s => s.id === state.rec.size);
    const prev = TIERS[Math.max(0, TIERS.indexOf(res.plan) - 1)];
    const reasons = [];
    if (res.ind) reasons.push(fmt(R.baseReason, { ind: L(res.ind.name), plan: P[minPlan(res.needs)].name }));
    else reasons.push(R.advReason);
    if (res.entSigs.length) reasons.push(R.entReason);
    const fl = ids => `<ul class="flist">${ids.map(id => { const f = F[id]; const tr = tierOf(f) || "V";
      return `<li><span><i class="dot g-${f.g}"></i>${ext(f.url, esc(f.name))}</span><span>${esc(R.from)} ${esc(P[tr].name)}</span></li>`; }).join("")}</ul>`;

      ${res.ind && INTEGRATIONS.some(x => (x.ind || []).includes(res.ind.id)) ? `<div><h3>${esc(u.int.forIndustry)}</h3><ul class="flist">${INTEGRATIONS.filter(x => (x.ind || []).includes(res.ind.id)).map(x => `<li><span>${ext(x.url, esc(x.name))}</span><span>${esc(L(x.d)).slice(0, 60)}…</span></li>`).join("")}</ul></div>` : ""}

  function renderCmpOut() {
    const u = t(), C = u.cmp, c = state.cmp, A = P[c.a], B = P[c.b];
    if (c.a === c.b) { $("#cmpout").innerHTML = `<p class="note">${esc(C.same)}</p>`; return; }
    const rel = relSet(c.hl);
    const onlyA = FEATURES.filter(f => f.plans.includes(c.a) && !f.plans.includes(c.b));
    const onlyB = FEATURES.filter(f => f.plans.includes(c.b) && !f.plans.includes(c.a));
    const both = FEATURES.filter(f => f.plans.includes(c.a) && f.plans.includes(c.b));
    const price = priceOf;
    const seats = p => Math.max(c.users, p.min);
    const tot = p => price(p) * seats(p);
    const dU = price(B) - price(A), dM = tot(B) - tot(A);
    const list = arr => arr.length ? `<ul class="flist">${GROUPS.flatMap(g => arr.filter(f => f.g === g.id)).map(f =>

    const sign = n => (n > 0 ? "+" : n < 0 ? "−" : "") + money(Math.abs(n));
    $("#cmpout").innerHTML = `
      <div class="kpis" style="margin-top:16px">
        <div class="kpi"><span>${esc(C.diff)} · ${esc(C.perUser)}</span><b class="delta ${dU > 0 ? "up" : "down"}">${sign(dU)}</b></div>
        <div class="kpi"><span>${esc(C.diff)} · ${esc(C.perMonth)} (${int(c.users)} ${esc(u.home.users)})</span><b class="delta ${dM > 0 ? "up" : "down"}">${sign(dM)}</b></div>
        <div class="kpi"><span>${esc(C.diff)} · ${esc(C.perYear)}</span><b class="delta ${dM > 0 ? "up" : "down"}">${sign(dM * 12)}</b></div>
        <div class="kpi"><span>${esc(C.both)}</span><b class="num">${both.length}</b></div>
      </div>
      ${rel ? `<p class="hint" style="margin-top:10px">● ${esc(C.relevant)}: ${esc(L(IND[c.hl].name))}</p>` : ""}
      <div class="cmp-cols">
        <div><h3>${esc(fmt(C.onlyA, { p: A.name }))} <span class="muted num">(${onlyA.length})</span></h3>${list(onlyA)}</div>
        <div><h3>${esc(fmt(C.onlyB, { p: B.name }))} <span class="muted num">(${onlyB.length})</span></h3>${list(onlyB)}</div>
      </div>`;
  }

  // ── Matrix
  function renderMatrix() {
    const u = t(), M = u.mx, s = state.mx;
    $("#view").innerHTML = `
      ${head(M.title, M.lead, updatedLine())}
      <div class="toolbar">
        <input id="mq" type="search" placeholder="${esc(M.search)}" value="${esc(s.q)}" aria-label="${esc(M.search)}">
        <label>${esc(M.group)} <select id="mg"><option value="">${esc(M.all)}</option>${GROUPS.map(g => `<option value="${g.id}" ${s.g === g.id ? "selected" : ""}>${esc(L(g.name))}</option>`).join("")}</select></label>
        <label>${esc(M.industry)} ${industrySelect("mi", s.i)}</label>
        <label class="check" style="padding:0"><input id="md" type="checkbox" ${s.diff ? "checked" : ""}><span>${esc(M.onlyDiff)}</span></label>
        <button class="btn" type="button" id="mexp">${esc(M.export)}</button>
        <button class="btn" type="button" id="mcopy">${esc(M.copy)}</button>
        ${billToggle()}
        <span class="mx-count" id="mcount"></span>
      </div>
      <div class="tbl-wrap"><table><thead><tr><th>${esc(M.feature)}</th>${PLANS.map(p => `<th class="c">${esc(p.name)}<br><span class="num muted" style="font-weight:500">${money(priceOf(p))}</span></th>`).join("")}</tr></thead><tbody id="mbody"></tbody></table></div>`;
    const upd = () => {
      s.q = $("#mq").value.trim(); s.g = $("#mg").value; s.i = $("#mi").value; s.diff = $("#md").checked;
      try {
        const qs = new URLSearchParams();
        if (s.q) qs.set("q", s.q); if (s.g) qs.set("g", s.g); if (s.i) qs.set("i", s.i); if (s.diff) qs.set("diff", "1");
        history.replaceState(null, "", (qs.toString() ? "?" + qs : location.pathname) + "#matrix");
      } catch (e) { /* ignore */ }
      renderMxBody();
    };
    $("#mq").addEventListener("input", upd);
    ["#mg", "#mi", "#md"].forEach(x => $(x).addEventListener("change", upd));
    $("#mexp").addEventListener("click", exportCsv);
    $("#mcopy").addEventListener("click", () => {
      const done = () => toast(M.copied);
      try { navigator.clipboard.writeText(location.href).then(done, () => toast(location.href)); } catch (e) { toast(location.href); }
    });
    renderMxBody();
  }

  function mxRows() {
    const s = state.mx, q = s.q.toLowerCase(), rel = relSet(s.i);
    return FEATURES.filter(f =>
      (!s.g || f.g === s.g) &&
      (!rel || rel.has(f.id)) &&
      (!s.diff || f.plans.length < 4) &&
      (!q || f.name.toLowerCase().includes(q) || L(f.d).toLowerCase().includes(q)));
  }

  function renderMxBody() {
    const u = t(), rows = mxRows();
    const html = GROUPS.map(g => {
      const fs = rows.filter(f => f.g === g.id);
      if (!fs.length) return "";
      return `<tr class="grp"><td colspan="5">${esc(L(g.name))}</td></tr>` + fs.map(f => `<tr>
        <td><span class="feat">${ext(f.url, esc(f.name))} <button class="i" type="button" data-detail="${f.id}" aria-label="${esc(u.info)}" style="border:0;background:none;color:var(--muted);padding:0 4px">ⓘ</button></span>
          <span class="sub">${esc(L(f.d))}</span>
          ${(f.badges || []).length ? `<span class="pills" style="margin-top:4px">${f.badges.map(b => `<span class="pill ${["us", "usreg", "eu", "third", "check"].includes(b) ? "warn" : "ok"}">${esc(L(BADGES[b]))}</span>`).join("")}</span>` : ""}</td>
        ${PLANS.map(p => f.plans.includes(p.id) ? `<td class="c yes" aria-label="✓">✓</td>` : `<td class="c no" aria-label="—">—</td>`).join("")}</tr>`).join("");
    }).join("");
    $("#mbody").innerHTML = html;
    $("#mcount").textContent = rows.length + " " + u.mx.shown;
  }

  function exportCsv() {
    const rows = mxRows();
    const q = v => '"' + String(v).replace(/"/g, '""') + '"';
    const lines = [["Group", "Feature", ...PLANS.map(p => p.name), "Description", "Notes", "Documentation"].map(q).join(",")];
    rows.forEach(f => lines.push([L(G[f.g].name), f.name, ...PLANS.map(p => f.plans.includes(p.id) ? "Yes" : ""), L(f.d), (f.badges || []).map(b => L(BADGES[b])).join("; "), f.url].map(q).join(",")));
    try {
      const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "sharefile-maps-matrix-" + SITE.updated + ".csv";
      document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { /* ignore */ }
  }

  // ── Calculator
  function renderCalc() {
    const u = t(), K = u.calc, c = state.calc;
    $("#view").innerHTML = `
      ${head(K.title, K.lead, updatedLine())}
      <div class="grid2">
        <form class="box" id="calcf" onsubmit="return false">
          <fieldset><legend>${esc(K.plan)}</legend><div class="choices">
            ${PLANS.map(p => `<label class="choice"><input type="radio" name="plan" value="${p.id}" ${c.plan === p.id ? "checked" : ""}><span>${esc(p.name)}</span></label>`).join("")}
          </div></fieldset>
          <label class="hint">${esc(K.users)}<br><input id="kusers" type="number" min="1" max="100000" value="${c.users}"></label>
          <fieldset><legend>${esc(K.billing)}</legend>${billToggle()}</fieldset>
          <p class="hint">${esc(K.storageNote)}</p>
          <p class="hint">${esc(K.priceNote)}</p>
        </form>
        <section class="box" id="calcout" aria-live="polite"></section>
      </div>`;
    const upd = () => {
      c.plan = ($('input[name="plan"]:checked') || {}).value || "P";
      c.users = Math.max(1, Math.min(100000, parseInt($("#kusers").value, 10) || 1));
      store.set("calc", c); renderCalcOut();
    };
    $("#calcf").addEventListener("change", upd);
    $("#kusers").addEventListener("input", upd);
    renderCalcOut();
  }

  const storageFor = (p, seats) => p.id === "V" ? int(seats) + " GB" : int(Math.max(3, seats)) + " TB";

  function renderCalcOut() {
    const u = t(), K = u.calc, c = state.calc, p = P[c.plan];
    const seats = Math.max(c.users, p.min);
    const per = priceOf(p);
    $("#calcout").innerHTML = `
      <p class="eyebrow">${esc(p.name)} · ${esc(billLabel())}</p>
      <div class="kpis">
        <div class="kpi"><span>${esc(K.perUser)}</span><b>${money(per)}</b></div>
        <div class="kpi"><span>${esc(K.monthTotal)}</span><b>${money(per * seats)}</b></div>
        <div class="kpi"><span>${esc(K.yearTotal)}</span><b>${money(per * seats * 12, 0)}</b></div>
        <div class="kpi"><span>${esc(K.storage)}</span><b>${storageFor(p, seats)}</b></div>
      </div>
      ${seats > c.users ? `<p class="note">${esc(fmt(K.minApplied, { n: p.min }))}</p>` : ""}
      <h3>${esc(K.allPlans)}</h3>
      <div class="tbl-wrap"><table><thead><tr><th></th><th class="c">${esc(K.perUser)}</th><th class="c">${esc(K.monthTotal)}</th><th class="c">${esc(K.yearTotal)}</th><th class="c">${esc(K.storage)}</th></tr></thead><tbody>
        ${PLANS.map(q => { const s = Math.max(c.users, q.min), pr = priceOf(q);
          return `<tr ${q.id === p.id ? 'style="background:var(--accent-soft)"' : ""}><td><b>${esc(q.name)}</b></td><td class="c num">${money(pr)}</td><td class="c num">${money(pr * s)}</td><td class="c num">${money(pr * s * 12, 0)}</td><td class="c num">${storageFor(q, s)}</td></tr>`; }).join("")}
      </tbody></table></div>`;
  }

  // ── Integrations
  const planPills = x => {
    if (x.plan === "check") return `<span class="pill warn">${esc(t().int.planCheck)}</span>`;
    if (!x.plan) return "";
    return PLANS.filter(p => x.plan.includes(p.id)).map(p => `<span class="pill">${esc(p.name)}</span>`).join("");
  };
  const intCard = x => `<article class="icard">
      <h3>${ext(x.url, esc(x.name))}</h3>
      <p>${esc(L(x.d))}</p>
      ${x.n ? `<p class="hint">${esc(L(x.n))}</p>` : ""}
      <div class="pills">${planPills(x)}${(x.badges || []).map(b => `<span class="pill warn">${esc(L(BADGES[b]))}</span>`).join("")}${(x.ind || []).map(i => `<span class="pill ok">${esc(L(IND[i].name))}</span>`).join("")}</div>
      ${x.also ? `<p class="hint">${x.also.map(a => ext(a.url, esc(a.label) + " ↗")).join(" · ")}</p>` : ""}
    </article>`;

  function renderIntegrations() {
    const u = t(), I = u.int;
    state.intg = state.intg || { g: "", i: "" };
    const adds = ["enhanced_portal", "request_list", "esign", "projects", "watermark", "view_only"];
    $("#view").innerHTML = `
      ${head(I.title, I.lead)}
      <section class="box m365">
        <h2>${esc(I.m365Title)}</h2>
        <p>${esc(I.m365Msg)}</p>
        <h3>${esc(I.m365Adds)}</h3>
        <ul class="flist">${adds.map(id => { const f = F[id]; return `<li><span><i class="dot g-${f.g}"></i>${ext(f.url, esc(f.name))}</span><span>${esc(u.rec.from)} ${esc(P[tierOf(f)].name)}</span></li>`; }).join("")}</ul>
      </section>
      <div class="toolbar" style="margin-top:20px">
        <label>${esc(I.group)} <select id="ig"><option value="">${esc(I.all)}</option>${INT_GROUPS.map(g => `<option value="${g.id}" ${state.intg.g === g.id ? "selected" : ""}>${esc(L(g.name))}</option>`).join("")}</select></label>
        <label>${esc(I.industry)} ${industrySelect("ii", state.intg.i)}</label>
        <span class="mx-count" id="icount"></span>
      </div>
      <div id="ilist"></div>
      <p class="hint" style="margin-top:16px">${esc(I.third)} ${esc(I.source)}</p>`;
    const draw = () => {
      const s = state.intg;
      const rows = INTEGRATIONS.filter(x => (!s.g || x.g === s.g) && (!s.i || (x.ind || []).includes(s.i) || x.g !== "ind"));
      $("#ilist").innerHTML = INT_GROUPS.map(g => {
        const xs = rows.filter(x => x.g === g.id);
        return xs.length ? `<section class="igroup"><h2>${esc(L(g.name))}</h2><div class="igrid">${xs.map(intCard).join("")}</div></section>` : "";
      }).join("");
      $("#icount").textContent = rows.length + " " + I.count;
    };
    $("#ig").addEventListener("change", e => { state.intg.g = e.target.value; draw(); });
    $("#ii").addEventListener("change", e => { state.intg.i = e.target.value; draw(); });
    draw();
  }

  // ── Knowledge, glossary, logs
  function renderKnowledge() {
    const u = t();
    $("#view").innerHTML = `${head(u.kn.title, u.kn.lead)}
      <div class="cols">${KNOWLEDGE.map(k => `<section class="box"><h3>${esc(L(k.g))}</h3><ul class="links">${k.links.map(l => `<li>${l.v ? "▶ " : ""}${ext(l.u, esc(l.t))}</li>`).join("")}</ul></section>`).join("")}</div>`;
  }

  function renderGlossary() {
    const u = t();
    $("#view").innerHTML = `${head(u.gl.title, u.gl.lead)}
      <div class="toolbar"><input id="gq" type="search" placeholder="${esc(u.gl.search)}" aria-label="${esc(u.gl.search)}"></div>
      <dl class="gl box" id="gll"></dl>`;
    const draw = () => {
      const q = $("#gq").value.toLowerCase();
      $("#gll").innerHTML = GLOSSARY.filter(g => !q || g.term.toLowerCase().includes(q) || L(g.d).toLowerCase().includes(q))
        .map(g => `<div><dt>${esc(g.term)}</dt><dd>${esc(L(g.d))}</dd></div>`).join("");
    };
    $("#gq").addEventListener("input", draw); draw();
  }

  function renderChangelog() {
    const u = t();
    $("#view").innerHTML = `${head(u.ch.title, u.ch.lead)}
      <div class="tbl-wrap"><table><tbody>${CHANGELOG.map(c => `<tr><td class="num" style="width:110px">${c.date}</td><td class="num" style="width:70px">v${c.v}</td><td>${esc(L(c.d))}</td></tr>`).join("")}</tbody></table></div>`;
  }

  function renderDisc() {
    const u = t();
    $("#view").innerHTML = `${head(u.ds.title, u.ds.lead)}
      <div class="tbl-wrap"><table><thead><tr><th>#</th><th>${esc(u.ds.title)}</th><th>${esc(u.ds.where)}</th></tr></thead><tbody>
      ${DISCREPANCIES.map((d, i) => `<tr><td class="num">${i + 1}</td><td>${esc(L(d.d))}</td><td>${ext(d.where, esc(d.where.replace(/^https:\/\/(www\.)?/, "")))}</td></tr>`).join("")}
      </tbody></table></div>`;
  }

  // ── Toast
  function toast(msg) {
    const el = document.createElement("div"); el.className = "toast"; el.textContent = msg;
    document.body.appendChild(el); setTimeout(() => el.remove(), 2200);
  }

  // ── Analytics with consent (only when an ID is configured)
  function loadAnalytics() {
    if (!SITE.analyticsId) return;
    const s = document.createElement("script");
    s.async = true; s.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(SITE.analyticsId);
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { window.dataLayer.push(arguments); };
    window.gtag("js", new Date()); window.gtag("config", SITE.analyticsId, { anonymize_ip: true });
  }
  function cookieBanner() {
    if (!SITE.analyticsId) return;
    const c = store.get("consent", null);
    if (c === "yes") { loadAnalytics(); return; }
    if (c === "no") return;
    const u = t(), el = document.createElement("div");
    el.className = "cookie"; el.setAttribute("role", "region");
    el.innerHTML = `<p>${esc(u.cookies.text)}</p><button class="btn" type="button" data-c="no">${esc(u.cookies.reject)}</button><button class="btn primary" type="button" data-c="yes">${esc(u.cookies.accept)}</button>`;
    el.addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (!b) return; store.set("consent", b.dataset.c); if (b.dataset.c === "yes") loadAnalytics(); el.remove(); });
    document.body.appendChild(el);
  }

  // ── Theme
  function applyTheme() {
    const th = store.get("theme", "system");
    if (th === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", th);
  }

  // ── Boot
  document.addEventListener("click", e => {
    const bt = e.target.closest("[data-bill]");
    if (bt) { state.bill = bt.dataset.bill; store.set("bill", state.bill); const y = window.scrollY; route(); window.scrollTo(0, y); return; }
    const d = e.target.closest("[data-detail]");
    if (d) { e.preventDefault(); openDetail(d.dataset.detail); }
  });
  $("#lang").addEventListener("change", e => { lang = e.target.value; store.set("lang", lang); document.documentElement.lang = lang; route(); });
  $("#theme").addEventListener("click", () => {
    const order = ["system", "light", "dark"], cur = store.get("theme", "system");
    store.set("theme", order[(order.indexOf(cur) + 1) % 3]); applyTheme(); renderChrome(($("#nav [aria-current]") || {}).getAttribute ? $("#nav [aria-current]").getAttribute("href").slice(1) : "home");
  });
  window.addEventListener("hashchange", route);
  document.documentElement.lang = lang;
  applyTheme();
  route();
  cookieBanner();
})();

</script>

</body>
</html>
